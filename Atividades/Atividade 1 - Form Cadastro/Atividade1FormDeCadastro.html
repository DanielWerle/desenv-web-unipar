<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Página de Cadastro</h1>
    <fieldset>
        <legend>Crie sua Conta</legend>

        <label for="user_name">Nome:</label>
        <br>
        <input type="text" id="nome" name="nome" pattern="[A-Za-zÁ-ÿ ]" required>
        <br><br>
        
        <label for="user_email">E-mail:</label>
        <br>
        <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
        <br><br>

        <label for="user_password">Senha (Minimo 8 caracteres):</label>
        <br>
        <input type="password" name="user_password" id="senha" minlength="8" required>
        <br><br>

        <label for="genero"><b>Gênero:</b></label>
        <br>

        <input type="radio" id="feminino" name="genero" value="feminio">
        <label for="feminio">Feminio</label>
        <br>

        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label>
        <br>

        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label>
        <br><br>

        <label for="bio">Biografia:</label>
        <br>
            <textarea name="bio" id="bio" rows="5" cols="23" placeholder="Fale um pouco sobre você..."></textarea>
        <br><br>

        <input type="checkbox" name="termos" id="termos">
        <label for="termos">Eu li e aceito os termos de uso</label>
    </fieldset>
    <br>
    
    <button>Cadastrar</button>
    <button>Limpar</button>
</body>
</html>
