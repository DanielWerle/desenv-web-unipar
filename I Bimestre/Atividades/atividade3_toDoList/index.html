<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <h1>To-Do List</h1>
        <p>Organize seu Dia</p>
    </section>

    <section id="criarTarefa">
        <label for="tarefa">Tarefa:</label>
        <input type="text" name="tarefa" placeholder="Nova Tarefa" id="tarefa">
        <button id="btnAdicionarTarefa">Adicionar</button>
    </section>

    <section id="tarefasAfazer">
        <h2>Tarefas a Fazer:</h2>

        <ul id="listaAfazer">
            
        </ul>
    </section>
</body>
<script src="script.js"></script>
</html>
