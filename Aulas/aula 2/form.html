<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: gray;
    }
</style>
<body>
    <fieldset>
        <legend>Registre-se</legend>
        <h3>Informe seus dados para realizar o cadastro na plataforma</h3>
        <form action="/url-api-back-end" method="post"> 
            
            <label for="user_name">Seu Nome:</label>
            <input type="text" id="nome" name="nome" pattern="[A-Za-zÁ-ÿ ]" placeholder="Nome" required>
            <br>
            
            <label for="user_email">Seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="email" required>
            <br>
            
            <label for="user_password">Sua Senha:</label>
            <input type="password" id="senha" minlength="6" 
                    name="senha" placeholder="senha" required>
            <br>
            
            <label for="bio">Insira sua biografia</label>
            <textarea name="bio" id="bio"
                        ></textarea>

            <br>
            <select name="melhor-time" id="time">
                <optgroup label="Time Série A">
                    <option value="Gremio">Gremio</option>
                    <option value="Vasco">Vasco</option>
                    <option value="Flamengo">Flamengo</option>
                    <option value="Corithians">Corithians</option>
                </optgroup>
                <optgroup label="Time série D">
                    <option value="Cascavel">Cascavel</option>
                </optgroup>
            </select>
        </form>
    </fieldset>
</body>
</html>
